
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, viewport-fit=cover"
  >

  <title>My AR Animation</title>

  <!-- A-Frame: displays your animation in AR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR: recognizes the printed artwork -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* Instructions shown at the top */
    #instructions {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      text-align: center;
      font-size: 15px;
      border-radius: 12px;
      z-index: 100;
      pointer-events: none;
    }

    /* Play animation button */
    #playButton {
      display: none;
      position: fixed;
      bottom: 105px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #ffffff;
      color: #000000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      z-index: 200;
      white-space: nowrap;
    }

    #playButton:disabled {
      opacity: 0.6;
    }

    /* Alternative video playback button */
    #fallbackButton {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 13px 22px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      border: 1px solid white;
      border-radius: 25px;
      font-size: 14px;
      z-index: 200;
      white-space: nowrap;
    }

  </style>

</head>

<body>

  <!-- Camera instructions -->
  <div id="instructions">
    Point your camera at the printed artwork
  </div>

  <!-- Button for starting AR animation -->
  <button id="playButton" type="button">
    ▶ Play Animation
  </button>

  <!-- Fallback for unsupported devices -->
  <a
    id="fallbackButton"
    href="./1st -walking.mp4"
    target="_blank"
    rel="noopener noreferrer"
  >
    Watch Without AR
  </a>

  <!-- Main augmented reality scene -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: false;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Load your animation -->
    <a-assets timeout="30000">

      <video
        id="animation"
        src="./1st -walking.mp4"
        preload="metadata"
        playsinline
        webkit-playsinline
        loop
      ></video>

    </a-assets>

    <!-- Camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- Image recognition target -->
    <a-entity
      id="posterTarget"
      mindar-image-target="targetIndex: 0"
    >

      <!-- AR animation overlay -->
      
<a-plane
  id="videoPlane"
  width="1"
  height="0.56275"
  position="0 0 0.01"
  material="color: #00FF00; shader: flat; side: double;"
></a-plane>


    </a-entity>

  </a-scene>

  <script>

    // Get the elements
    const video = document.querySelector("#animation");
    const target = document.querySelector("#posterTarget");
    const videoPlane = document.querySelector("#videoPlane");
    const playButton = document.querySelector("#playButton");
    const instructions = document.querySelector("#instructions");
    const scene = document.querySelector("a-scene");

    // Track whether the artwork is visible
    let targetVisible = false;

    // Automatically match the actual video aspect ratio
    function updateVideoDimensions() {

      if (video.videoWidth > 0 &&
          video.videoHeight > 0) {

        const aspectRatio =
          video.videoHeight / video.videoWidth;

        videoPlane.setAttribute(
          "height",
          aspectRatio
        );

        console.log(
          "Video aspect ratio:",
          video.videoWidth,
          "x",
          video.videoHeight
        );
      }
    }

    // Read the original MP4 dimensions
    video.addEventListener(
      "loadedmetadata",
      updateVideoDimensions
    );

    // If the metadata loaded earlier
    if (video.readyState >= 1) {
      updateVideoDimensions();
    }

    // When the phone recognizes the printed artwork
    target.addEventListener("targetFound", () => {

      targetVisible = true;

      instructions.textContent =
        "Artwork detected! Tap Play Animation.";

      if (video.paused) {
        playButton.style.display = "block";
      }

    });

    // When the phone moves away from the artwork
    target.addEventListener("targetLost", () => {

      targetVisible = false;

      video.pause();

      playButton.style.display = "none";

      instructions.textContent =
        "Point your camera at the printed artwork";

    });

    // Start the animation after a user tap
     playButton.addEventListener("click", () => {    instructions.textContent =     "Starting animation...";    // Do not seek before starting playback.   // Some mobile browsers have trouble with that.    const playPromise = video.play();    if (playPromise !== undefined) {      playPromise.then(() => {        instructions.textContent =         "Video playing!";        playButton.style.display = "none";      }).catch((error) => {        console.error("Playback failed:", error);        instructions.textContent =         "Playback failed: " + error.name;        playButton.style.display = "block";      });    }  });

      if (!targetVisible) {
        return;
      }

      playButton.disabled = true;

      try {

        // Play from the beginning when tapped
        video.currentTime = 0;

        await video.play();

        playButton.style.display = "none";

        instructions.textContent =
          "Enjoy your AR animation!";

        // If tracking was lost during playback startup
        if (!targetVisible) {
          video.pause();
        }

      } catch (error) {

        console.error(
          "Video playback error:",
          error
        );

        instructions.textContent =
          "Unable to play. Please try again.";

        if (targetVisible) {
          playButton.style.display = "block";
        }

      } finally {

        playButton.disabled = false;

      }

    });

    // Helpful message if the video fails to load
    video.addEventListener("error", () => {

      instructions.textContent =
        "Video could not load. Check animation.mp4.";

    });

    // Camera or AR initialization failure
    scene.addEventListener("arError", () => {

      instructions.textContent =
        "AR could not start. Check camera permission " +
        "or use Watch Without AR.";

    });

  </script>

</body>
</html>
